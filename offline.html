<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#14121A">
<title>Offline - TicketHub</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #14121A;
        color: #F1EEF7;
        font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        text-align: center;
    }
    .card { max-width: 380px; }
    img { width: 88px; height: 88px; border-radius: 22px; margin-bottom: 24px; }
    h1 { font-size: 22px; margin-bottom: 10px; }
    p { color: #A9A3B8; font-size: 15px; line-height: 1.6; margin-bottom: 28px; }
    button {
        border: 0;
        padding: 12px 28px;
        border-radius: 10px;
        background: #9D7CF9;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
    }
</style>
</head>
<body>
<div class="card">
    <img src="icons/icon-192.png" alt="TicketHub">
    <h1>You're offline</h1>
    <p>TicketHub needs an internet connection to load events and tickets. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
</div>
<script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
